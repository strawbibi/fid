  <rect width="800" height="600" fill="#faf6ef"/>
  <polygon points="400,150 300,350 500,350" fill="#2f4538"/>
  <polygon points="400,150 350,350 400,350" fill="#3f5c48"/>
  <polygon points="330,270 260,400 400,400" fill="#4a6b52"/>
