  <text x="400" y="490" font-family="Georgia, serif" font-size="46" fill="#2f4538" text-anchor="middle">Peak &amp; Pine</text>
  <text x="400" y="525" font-family="Georgia, serif" font-size="18" letter-spacing="4" fill="#7a8b7d" text-anchor="middle">OUTFITTERS</text>
